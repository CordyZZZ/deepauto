<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-zh="DeepAuto Investments · 核心竞争力" data-en="DeepAuto Investments · Strength">DeepAuto Investments · 核心竞争力</title>
  <meta name="description" content="基于真实场景的世界模型、技术测评，以及数据飞轮 RSI。">
  <link rel="stylesheet" href="styles.css?v=25">
</head>
<body data-page="core">
  <main>
    <section id="world">
      <h1 data-zh="基于真实场景的世界模型" data-en="A world model on real markets">基于真实场景的世界模型</h1>
      <div class="stage">
        <canvas id="market" width="960" height="420" aria-label="沪深300日线，可拖动分界，鼠标经过显示价格"></canvas>
        <p class="tip" id="tip" hidden></p>
        <div class="beatrow">
          <div>
            <p class="beat" id="beat">沪深300</p>
            <p class="note" id="beat-en"></p>
          </div>
          <button type="button" class="ghost" id="replay" data-zh="再看一次" data-en="Replay">再看一次</button>
        </div>
        <p class="note" data-zh="日线收盘 · 000300 · 2018.1.2 – 2026.11.16。拖动竖线，移动真实与模拟的分界。" data-en="Daily close · 000300 · 2018.1.2 – 2026.11.16. Drag the line to move the split between real and simulated.">日线收盘 · 000300 · 2018.1.2 – 2026.11.16。拖动竖线，移动真实与模拟的分界。</p>
      </div>
    </section>

    <section class="block" id="bench">
      <h2>技术测评</h2>
      <ul class="tasks">
        <li><b>预测</b>历史之后，要的是分布，不是一条收盘价。</li>
        <li><b>决策</b>成本扣掉之后，仓位还是否成立。</li>
        <li><b>校准</b>模拟和后来的真实走势，差距留在明处。</li>
        <li><b>确认</b>没有点头，就不执行。</li>
      </ul>
      <p class="lede">之后会考虑开源。</p>
      <div class="stage">
        <canvas id="walk" width="960" height="240" aria-label="技术测评"></canvas>
      </div>
    </section>

    <section class="block" id="strategy">
      <h2>数据飞轮 RSI</h2>
      <p class="lede">数据进来，排练，做决定，反馈再回到数据。</p>
      <div class="wheel" id="wheel" aria-label="数据飞轮 RSI"></div>
    </section>
  </main>
  <footer>DeepAuto Investments · Cordelia</footer>
  <script src="lang.js?v=25"></script>
  <script src="nav.js?v=25"></script>
  <script src="csi.js?v=25"></script>
  <script src="world.js?v=25"></script>
  <script src="loop.js?v=25"></script>
</body>
</html>

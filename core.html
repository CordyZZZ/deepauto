<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-zh="DeepAuto Investments · 核心竞争力" data-en="DeepAuto Investments · Strength">DeepAuto Investments · 核心竞争力</title>
  <meta name="description" content="基于真实场景的世界模型、技术测评，以及数据飞轮 RSI。">
  <link rel="stylesheet" href="styles.css?v=26">
</head>
<body data-page="core">
  <main>
    <section id="world">
      <h1 data-zh="基于真实场景的世界模型" data-en="A world model on real markets">基于真实场景的世界模型</h1>
      <div class="stage">
        <canvas id="market" width="960" height="420" aria-label="沪深300日线，可拖动分界，鼠标经过显示价格"></canvas>
        <p class="tip" id="tip" hidden></p>
        <div class="beatrow">
          <div>
            <p class="beat" id="beat">沪深300</p>
            <p class="note" id="beat-en"></p>
          </div>
          <button type="button" class="ghost" id="replay" data-zh="再看一次" data-en="Replay">再看一次</button>
        </div>
        <p class="note" data-zh="日线收盘 · 000300 · 2018.1.2 – 2026.11.16。拖动竖线，移动真实与模拟的分界。" data-en="Daily close · 000300 · 2018.1.2 – 2026.11.16. Drag the line to move the split between real and simulated.">日线收盘 · 000300 · 2018.1.2 – 2026.11.16。拖动竖线，移动真实与模拟的分界。</p>
      </div>
    </section>

    <section class="block" id="bench">
      <h2>技术测评</h2>
      <ul class="tasks">
        <li><b>预测</b>历史之后，要的是分布，不是一条收盘价。</li>
        <li><b>决策</b>成本扣掉之后，仓位还是否成立。</li>
        <li><b>校准</b>模拟和后来的真实走势，差距留在明处。</li>
        <li><b>确认</b>没有点头，就不执行。</li>
      </ul>
      <p class="lede">之后会考虑开源。</p>
      <div class="stage">
        <canvas id="walk" width="960" height="240" aria-label="技术测评"></canvas>
      </div>
    </section>

    <section class="block" id="strategy">
      <h2>数据飞轮 RSI</h2>
      <p class="lede">输入是数据，输出是决策。做过的结果再流回去，这一圈自己学。</p>
      <div class="fly" id="wheel">
        <div class="port">
          <span>输入</span>
          <b>数据</b>
        </div>
        <div class="fly-loop">
          <svg viewBox="0 0 520 220" aria-hidden="true">
            <path id="lap" d="M88 58 H430 Q472 58 472 100 V120 Q472 162 430 162 H88 Q46 162 46 120 V100 Q46 58 88 58 Z" fill="none" stroke="currentColor" stroke-width="1.25" />
            <polygon class="head" points="392,51 414,58 392,65" />
            <polygon class="head" points="126,155 104,162 126,169" />
            <circle class="spark" r="4.5" cx="48" cy="58">
              <animateMotion id="lap-motion" dur="18s" repeatCount="indefinite">
                <mpath href="#lap" />
              </animateMotion>
            </circle>
          </svg>
          <p class="on-top">排练</p>
          <p class="on-bot">自我学习</p>
          <p class="fly-hub">RSI</p>
        </div>
        <div class="port">
          <span>输出</span>
          <b>决策</b>
        </div>
      </div>
    </section>
  </main>
  <footer>DeepAuto Investments · Cordelia</footer>
  <script src="lang.js?v=26"></script>
  <script src="nav.js?v=26"></script>
  <script src="csi.js?v=26"></script>
  <script src="world.js?v=26"></script>
  <script src="loop.js?v=26"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepAuto · 优化策略</title>
  <meta name="description" content="端到端。优化为决策服务。数据进入预测模型，再进入决策模型，得到结果。">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="optimize">
  <main>
    <h1>优化为决策服务。<small class="en">Optimization serves the decision.</small></h1>
    <p class="lede">端到端。一次训练，从数据走到结果。<small class="en">End to end. One pass, from data to result.</small></p>

    <div class="stage">
      <div class="chain" id="chain" aria-label="数据到预测模型，到决策模型，到结果">
        <div class="node"><b>数据</b><small>Data</small></div>
        <div class="flow"><i></i></div>
        <div class="node"><b>预测模型</b><small>Prediction</small></div>
        <div class="flow"><i></i></div>
        <div class="node"><b>决策模型</b><small>Decision</small></div>
        <div class="flow"><i></i></div>
        <div class="node"><b>结果</b><small>Result</small></div>
      </div>
      <div class="beatrow">
        <p class="note">预测和决策一起训练。出来的，是结果。<small class="en">Prediction and decision train together. What comes out is the result.</small></p>
        <button type="button" class="ghost" id="replay">再看一次<small class="en">Replay</small></button>
      </div>
    </div>

    <p class="next"><a href="agent.html">下一页 · 伙伴<small class="en">Next · Partner</small></a></p>

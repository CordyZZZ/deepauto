<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepAuto · 智能体</title>
  <meta name="description" content="说出一句观点，看到一份仓位。确认之后才执行。">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="agent">
  <main>
    <h1>说出观点。确认之后才执行。</h1>
    <p class="lede">一句话进去。预测和优化在黑箱里一起工作，出来的是仓位。</p>

    <form id="form" class="stage">
      <label for="view">你的观点</label>
      <div class="row">
        <input id="view" name="view" type="text" required placeholder="如果美联储降息，加仓科技龙头">
        <button type="submit">生成仓位</button>
      </div>
      <p class="note">这一版只走到仓位预览，不会下单。</p>
    </form>

    <section id="result" class="machine" hidden aria-live="polite">
      <p class="quote" id="echo" tabindex="-1"></p>
      <div class="box">
        <div class="node" id="pred">预测</div>
        <div class="flow" id="flow"><i></i></div>
        <div class="node" id="opt">优化</div>
        <p class="pno">预测和优化一起训练，直接给出仓位。</p>
      </div>
      <dl class="out" id="out" hidden>
        <dt>方向</dt>
        <dd>顺着这句观点</dd>
        <dt>仓位</dt>
        <dd>一份预览仓位</dd>
      </dl>
      <div>
        <button type="button" id="account" disabled>连接到账户</button>
        <p class="note">账户还没有接上。这一步只是预览。</p>
      </div>
    </section>
  </main>
  <footer>DeepAuto Investments</footer>
  <script src="nav.js"></script>
  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    const echo = document.getElementById("echo");
    const pred = document.getElementById("pred");
    const opt = document.getElementById("opt");
    const flow = document.getElementById("flow");
    const out = document.getElementById("out");
    let timer = 0;

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = document.getElementById("view").value.trim();
      if (!text) return;
      window.clearTimeout(timer);
      echo.textContent = text;
      pred.classList.remove("on");
      opt.classList.remove("on");
      flow.classList.remove("run");
      out.hidden = true;
      result.hidden = false;
      echo.focus();

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) {
        pred.classList.add("on");
        opt.classList.add("on");
        out.hidden = false;
        return;
      }

      timer = window.setTimeout(() => pred.classList.add("on"), 180);
      window.setTimeout(() => flow.classList.add("run"), 520);
      window.setTimeout(() => opt.classList.add("on"), 1100);
      window.setTimeout(() => { out.hidden = false; }, 1600);
    });
  </script>
</body>
</html>
